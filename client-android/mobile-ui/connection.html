<section class="settings-view" data-view="connection" hidden><h2>Connexion au serveur</h2><p>Choisissez votre connexion pour cet appareil.</p>
<form id="endpoint-form" class="settings-card"><label for="connection-mode">Mode de connexion</label><select id="connection-mode"><option value="https">Internet · HTTPS</option><option value="wireguard">Tunnel privé · WireGuard</option></select><small>HTTPS passe par la connexion Internet sécurisée du serveur. WireGuard utilise le tunnel privé de votre profil.</small><label for="endpoint">Adresse du serveur</label><input id="endpoint" readonly aria-label="Adresse du serveur"><div class="actions"><button class="secondary primary" type="submit">Appliquer la connexion</button><button id="android-network-settings" class="secondary" type="button">Paramètres de connexion</button></div><p id="connection-transfer-status" class="muted" role="status"></p></form>
<div class="settings-card"><h3>État de la connexion</h3><p id="connection-diagnostic" role="status">Vérification en cours…</p><button id="reconnect" class="secondary" type="button">Réessayer la connexion</button></div></section>
