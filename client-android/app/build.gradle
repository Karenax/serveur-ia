plugins { id 'com.android.application' }
android {
    namespace 'net.karenax.fred'
    compileSdk 36
    defaultConfig {
        applicationId 'net.karenax.fred'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '1.0.10'
        testInstrumentationRunner 'net.karenax.fred.SelfTestInstrumentation'
    }
    buildTypes {
        debug { applicationIdSuffix '.voiceqa' }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    packaging { jniLibs { useLegacyPackaging true } }
}
