<template id="ws-layout">
<section class="settings-view" data-view="projects" hidden><h2>Projets</h2><p>Un espace pour vos documents, vos discussions et vos idées.</p>
<div class="page-toolbar"><div class="ws-project-tools"><input id="ws-project-search" class="ws-field" type="search" placeholder="Rechercher un projet…" aria-label="Rechercher un projet"><label><input id="ws-archived" type="checkbox"> Archivés</label></div><div class="ws-toolbar"><button id="ui-project-create" class="secondary primary" type="button">＋ Nouveau projet</button><button type="button" class="icon-button" aria-label="Actualiser les projets" title="Actualiser" id="ws-refresh">↻</button></div></div>
<form id="ws-create-project" class="ui-create-project" hidden><input class="ws-field" id="ws-project-name" maxlength="120" placeholder="Nom du projet" aria-label="Nom du nouveau projet" required><button class="secondary primary">Créer</button></form>
<div class="ws-grid"><div id="ws-project-list" class="ws-list"></div><div><p id="ws-project-empty" class="ws-project-empty">Sélectionnez un projet pour retrouver votre travail.<br>Ou créez votre premier espace.</p><div id="ws-project-detail" hidden>
<div class="project-detail-header"><h3 id="ui-project-title">Votre projet</h3><button id="ws-project-chat" type="button" class="secondary">Discuter du projet ↗</button></div>
<nav class="project-tabs" aria-label="Rubriques du projet"><button type="button" data-project-tab="documents" class="active">Documents</button><button type="button" data-project-tab="conversations">Discussions</button><button type="button" data-project-tab="memory">Mémoire</button><button type="button" data-project-tab="instructions">Consignes</button></nav>
<div class="project-pane" data-project-pane="documents"><div class="ws-doc-workspace"><div class="ws-doc-library"><div class="ws-toolbar"><button id="ws-new-document" class="secondary">＋ Note</button><label class="secondary" tabindex="0" role="button" id="ui-upload-label">Importer<input id="ws-upload" type="file" accept=".txt,.md,.docx,.pdf" hidden></label></div><small class="muted">TXT, MD, Word, PDF texte<br>2 Mo par fichier · Envoi au serveur</small><div id="ws-documents" class="ws-list"></div></div>
<div><div id="ui-document-empty" class="ws-empty">Choisissez un document,<br>ou commencez avec une nouvelle note.</div><div id="ws-document-editor" class="ws-card" hidden><div class="editor-heading"><input id="ws-document-title" class="ws-field ws-document-title" maxlength="180" aria-label="Titre du document"><details class="menu"><summary aria-label="Actions du document">···</summary><div class="menu-body"><button id="ws-document-save" class="secondary">Enregistrer maintenant</button><button id="ws-document-reload" class="secondary">Comparer au serveur</button><button id="ws-document-export" class="secondary">Exporter le texte</button><button id="ws-document-original" class="secondary">Fichier d’origine</button><button id="ws-document-delete" class="secondary danger">Supprimer le document</button></div></details></div><textarea id="ws-document-text" class="ws-editor" maxlength="500000" aria-label="Texte du document" placeholder="Commencez à écrire…"></textarea><div class="editor-footer"><span id="ws-document-status" class="ws-status" role="status"></span><button id="ws-document-chat" class="secondary">Discuter du document ↗</button></div>
<details class="revision-details"><summary>Améliorer le texte avec l’IA</summary><form id="ws-revise"><label class="ws-label" for="ws-revise-prompt">Votre demande</label><input id="ws-revise-prompt" class="ws-field" maxlength="4000" placeholder="Clarifier les phrases, conserver les chiffres…" required><button class="secondary">Préparer un brouillon</button></form></details><div id="ws-proposal" hidden><h3>Brouillon à examiner</h3><textarea id="ws-proposal-text" class="ws-editor" aria-label="Révision proposée"></textarea><div class="ws-toolbar"><button id="ws-proposal-accept" class="secondary primary">Accepter et enregistrer</button><button id="ws-proposal-decline" class="secondary">Refuser</button></div><p class="muted">Le document actuel reste visible au-dessus pour comparaison.</p></div></div></div></div>
<details class="revision-details"><summary>Rechercher un passage dans les documents</summary><form id="ws-search-form" class="ws-card"><input id="ws-search-query" class="ws-field" maxlength="2000" placeholder="Question ou mots à rechercher" aria-label="Rechercher dans les documents" required><button class="secondary">Chercher</button><div id="ws-sources"></div></form></details></div>
<div class="project-pane" data-project-pane="conversations" hidden><div class="ws-card"><h3>Discussions du projet</h3><p class="muted">Glissez une conversation sur un projet pour la déplacer. Clic droit pour déplacer, archiver ou supprimer.</p><label class="muted"><input id="ws-conversation-archived" type="checkbox"> Afficher les discussions archivées</label><div id="ws-conversations" class="ws-list"></div></div></div>
<div class="project-pane" data-project-pane="memory" hidden><div class="ws-card"><h3>Ce que l’assistant doit retenir</h3><p class="muted">Choisissez les faits et préférences utiles pour ce projet.</p><form id="ws-memory-form"><textarea id="ws-memory-text" maxlength="2000" placeholder="Une préférence, un fait, une règle à retenir…" aria-label="Nouvelle mémoire du projet" required></textarea><button class="secondary">Ajouter à la mémoire</button></form><div id="ws-memories"></div></div></div>
<div class="project-pane" data-project-pane="instructions" hidden><form id="ws-project-form" class="ws-card"><label class="ws-label" for="ws-project-title">Nom du projet</label><input id="ws-project-title" class="ws-field" maxlength="120" required><label class="ws-label" for="ws-project-instructions">Consignes du projet</label><textarea id="ws-project-instructions" class="ws-instructions" maxlength="12000" placeholder="Objectif, destinataire, contraintes…"></textarea><div class="ws-toolbar"><button class="secondary primary">Enregistrer les consignes</button><button id="ws-project-archive" type="button" class="secondary">Archiver</button></div><span id="ws-project-status" class="ws-status" role="status"></span></form></div>
</div></div></div></section>
<section class="settings-view" data-view="tasks" hidden><h2>Tâches</h2><p>Confiez un travail au serveur. Retrouvez le résultat même après avoir fermé l’application.</p><details class="task-composer" id="ui-task-create"><summary>＋ Nouvelle tâche</summary><form id="ws-task-form" class="ws-card"><div class="task-form-grid"><div><label class="ws-label" for="ws-task-project">Projet</label><select id="ws-task-project" required></select></div><div class="full"><label class="ws-label" for="ws-task-prompt">Ce qu’il faut préparer</label><textarea id="ws-task-prompt" maxlength="12000" required placeholder="Décrivez le résultat attendu…"></textarea></div></div>
<details class="task-options"><summary>Recherche et planification</summary><div><label class="ws-label" for="ws-task-kind">Type de travail</label><select id="ws-task-kind"><option value="analysis">Analyse ou rédaction</option><option value="web">Recherche web</option></select><div id="ui-task-web" hidden><label class="ws-label" for="ws-task-url">URL HTTPS publique (facultatif)</label><input id="ws-task-url" class="ws-field" maxlength="2000" placeholder="https://…"><small class="muted">Sans URL, la question est transmise à Brave. Les documents du projet ne sont pas envoyés à ce fournisseur.</small></div><div class="ws-toolbar"><label>Démarrer <select id="ws-task-delay"><option value="0">Maintenant</option><option value="60">Dans 1 heure</option><option value="1440">Demain</option></select></label><label>Répéter <select id="ws-task-repeat"><option value="0">Une seule fois</option><option value="24">Tous les jours</option><option value="168">Chaque semaine</option></select></label></div></div></details><div class="ws-toolbar"><button class="secondary primary">Lancer la tâche</button><button type="button" class="secondary" id="ws-task-refresh">Actualiser</button></div></form></details>
<span id="ws-task-notice" class="ws-status" role="status"></span><nav class="task-filter" aria-label="Filtrer les tâches"><button type="button" data-job-filter="all" class="active">Toutes</button><button type="button" data-job-filter="active">En cours</button><button type="button" data-job-filter="completed">Terminées</button><button type="button" data-job-filter="attention">À reprendre</button></nav><div id="ws-jobs"></div><div id="ui-jobs-empty" class="ws-empty" hidden>Aucune tâche dans cette rubrique.</div><div id="ws-job-result" class="ws-card" hidden><h3 id="ws-job-title"></h3><div id="ws-job-content" class="ws-result"></div><div id="ws-job-sources"></div><div class="ws-toolbar"><button id="ws-job-save" class="secondary">Enregistrer comme document</button><button id="ws-job-export" class="secondary">Exporter</button></div></div></section>
<aside id="ws-side" class="ws-document-side" aria-label="Document et sources" hidden><button id="ws-side-close" class="secondary">Fermer ×</button><h3 id="ws-side-title"></h3><div id="ws-side-text" class="ws-result"></div></aside>
</template>
<script nonce="__NONCE__">
document.querySelector('.workspace').append($('ws-layout').content.cloneNode(true));
const ws={data:null,project:null,document:null,dirty:false,conflict:false,timer:null,writes:Promise.resolve(),draftWrites:Promise.resolve(),revisionJob:null,revisionDoc:null,result:null,seen:new Set(),initialized:false,polling:false,projectDirty:false};
function wsElement(tag,value,klass){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;if(klass)n.className=klass;return n;}
function wsButton(title,run){const b=wsElement('button',title,'secondary');b.type='button';b.onclick=()=>wsTry(run);return b;}
async function wsTry(run){try{error('');return await run();}catch(e){error(e);return null;}}
function wsAction(action,body={}){return api('/v1/workspace/action',{action,reset_id:'20261006-remove-assistants',...body});}
function wsCurrent(){return library.find(c=>c.id===currentId);}
// Keep a single save in flight, including edits arriving during a request.
const wsFlushOnce=wsFlush;let wsFlushPending=null;
wsFlush=function(){if(wsFlushPending)return wsFlushPending;wsFlushPending=(async()=>{do{await wsFlushOnce();}while(ws.dirty&&!ws.conflict);})().finally(()=>wsFlushPending=null);return wsFlushPending;};
function workspaceFields(){const c=wsCurrent();return {project_id:c?.project_id||null,document_id:c?.document_id||null};}
function workspaceShowSources(sources){$('ws-side-title').textContent='Passages utilisés pour cette réponse';wsDrawSources($('ws-side-text'),sources);$('ws-side').hidden=false;}
function wsOptions(select,rows,empty){const old=select.value;select.replaceChildren();if(empty)select.append(new Option(empty,''));for(const r of rows)select.append(new Option(r.title||r.name,r.id));if([...select.options].some(o=>o.value===old))select.value=old;}
const pickers=wsElement('div',undefined,'ws-pickers');pickers.innerHTML='<label>Projet <select id="ws-chat-project" aria-label="Projet de la discussion"></select></label><label>Document <select id="ws-chat-document" aria-label="Document de référence"></select></label><button id="ws-publish" class="secondary">Enregistrer au projet</button><button id="ws-panel" class="secondary">Voir le document</button>';
document.querySelector('[data-view="chat"] .conversation-top').after(pickers);
for(const [view,title] of [['projects','Projets'],['tasks','Tâches']]){const b=wsElement('button',title,'nav-button');b.dataset.viewButton=view;b.onclick=()=>showView(view);document.querySelector('#client-navigation').insertBefore(b,document.querySelector('[data-view-button="access"]'));}
const originalShowView=showView;showView=function(name){originalShowView(name);if(['projects','tasks'].includes(name)){$('workspace-heading').textContent=({projects:'Projets',tasks:'Tâches'})[name];wsRefresh().catch(e=>error(e));}if(name!=='chat')$('ws-side').hidden=true;};
const wsSettings=wsElement('section',undefined,'settings-view');wsSettings.dataset.view='settings';wsSettings.hidden=true;
const wsSettingsNav=wsElement('nav',undefined,'ws-toolbar');wsSettingsNav.setAttribute('aria-label','Réglages du client');wsSettings.append(wsElement('h2','Réglages'),wsSettingsNav);
for(const name of ['access','connection','updates','api']){const b=document.querySelector('[data-view-button="'+name+'"]');b.className='secondary';wsSettingsNav.append(b);const pane=document.querySelector('[data-view="'+name+'"]');pane.style.padding='0';pane.style.overflow='visible';wsSettings.append(pane);}
document.querySelector('.workspace').append(wsSettings);
const wsSettingsButton=wsElement('button','Réglages','nav-button');wsSettingsButton.dataset.viewButton='settings';document.querySelector('#client-navigation').append(wsSettingsButton);
const wsShowViewOnce=showView;showView=function(name){const selected=name==='settings'?'access':name;wsShowViewOnce(selected);wsSettings.hidden=!['access','connection','updates','api'].includes(selected);wsSettingsButton.classList.toggle('active',!wsSettings.hidden);if(!wsSettings.hidden)$('workspace-heading').textContent='Réglages · '+({access:'Mon accès',connection:'Connexion',updates:'Mises à jour',api:'API locale'})[selected];};
wsSettingsButton.onclick=()=>showView('settings');
const originalDrawLibrary=drawLibrary;drawLibrary=function(){originalDrawLibrary();wsChatSelections();};
const wsFillProjectOnce=wsFillProject;wsFillProject=function(){if(document.activeElement?.closest('#ws-memories'))return;wsFillProjectOnce();ws.projectRevision=ws.data?.projects.find(p=>p.id===ws.project)?.revision;};
function wsChatSelections(){if(!ws.data)return;const c=wsCurrent();wsOptions($('ws-chat-project'),ws.data.projects.filter(p=>!p.archived||p.id===c?.project_id),'Sans projet');$('ws-chat-project').value=c?.project_id||'';const p=ws.data.projects.find(p=>p.id===c?.project_id);wsOptions($('ws-chat-document'),p?.documents||[],'Tous les documents');$('ws-chat-document').value=c?.document_id||'';for(const id of ['ws-chat-project','ws-chat-document','ws-publish'])$(id).disabled=conversationLocked();$('ws-panel').hidden=!c?.document_id;}
for(const id of ['ws-chat-project','ws-chat-document'])$(id).onchange=()=>wsTry(async()=>{if(conversationLocked())return;const c=wsCurrent();if(id==='ws-chat-project'){const target=$('ws-chat-project').value||null;wsChatSelections();await wsMoveConversation(c.id,target);return;}c.document_id=$('ws-chat-document').value||null;save();wsChatSelections();});
$('ws-publish').onclick=()=>wsTry(()=>wsConversationAction(async()=>{const c=wsCurrent();if(!c.project_id)throw new Error('Choisissez un projet pour enregistrer la discussion sur le serveur.');const r=await wsAction('conversation_save',{id:c.id.replaceAll('-',''),project:c.project_id,title:c.title,messages:c.messages,archived:Boolean(c.archived),revision:c.server_revision||0});c.server_revision=r.revision;}));
$('ws-panel').onclick=()=>wsTry(async()=>{const c=wsCurrent();if(!c.document_id)return;const d=await wsAction('document_get',{id:c.document_id});$('ws-side-title').textContent=d.title;$('ws-side-text').textContent=d.text;$('ws-side').hidden=false;});$('ws-side-close').onclick=()=>$('ws-side').hidden=true;
async function wsRefresh(){if(ws.polling)return;ws.polling=true;try{const data=await api('/v1/workspace');ws.data=data;wsChatSelections();wsDrawProjects();wsDrawJobs();wsOptions($('ws-task-project'),data.projects.filter(p=>!p.archived));if(ws.project&&!ws.projectDirty)wsFillProject();if(!ws.initialized){ws.seen=new Set(data.jobs.filter(j=>j.state==='completed').map(j=>j.id));ws.initialized=true;}else{const incoming=data.jobs.filter(j=>j.state==='completed'&&!ws.seen.has(j.id));if(incoming.length){$('ws-task-notice').textContent=incoming.length+' nouveau(x) résultat(s) disponible(s).';const b=document.querySelector('[data-view-button="tasks"]');b.textContent='Tâches · résultats disponibles';for(const j of incoming)ws.seen.add(j.id);}}}finally{ws.polling=false;}}
const wsRefreshOnce=wsRefresh;wsRefresh=function(){if(ws.refreshPending)return ws.refreshPending;ws.refreshPending=wsRefreshOnce().finally(()=>ws.refreshPending=null);return ws.refreshPending;};
function wsDrawProjects(){const query=$('ws-project-search').value.toLocaleLowerCase(),all=ws.data?.projects||[];const list=all.filter(p=>(!p.archived||$('ws-archived').checked)&&(p.title+' '+p.instructions).toLocaleLowerCase().includes(query));$('ws-project-list').replaceChildren(...list.map(p=>{const b=wsButton(p.title+(p.archived?' · archivé':''),()=>wsSelectProject(p.id));b.classList.toggle('selected',p.id===ws.project);return b;}));if(!list.length)$('ws-project-list').append(wsElement('p','Aucun projet correspondant.','muted'));}
async function wsSelectProject(id){await wsFlush();if(ws.projectDirty)throw new Error('Enregistrez les consignes du projet avant de changer de projet.');ws.project=id;ws.document=null;ws.dirty=false;ws.conflict=false;$('ws-document-editor').hidden=true;$('ws-proposal').hidden=true;wsFillProject();wsDrawProjects();}
function wsFillProject(){const p=ws.data?.projects.find(p=>p.id===ws.project);$('ws-project-empty').hidden=!!p;$('ws-project-detail').hidden=!p;if(!p)return;$('ws-project-title').value=p.title;$('ws-project-instructions').value=p.instructions;$('ws-project-archive').textContent=p.archived?'Restaurer le projet':'Archiver';$('ws-project-status').textContent=p.archived?'Projet archivé':'';$('ws-documents').replaceChildren(...p.documents.map(d=>wsButton(d.title,()=>wsOpenDocument(d.id))));$('ws-memories').replaceChildren(...p.memories.map(m=>{const row=wsElement('div',undefined,'ws-card'),input=wsElement('textarea');input.value=m.text;input.maxLength=2000;row.append(input,wsButton('Modifier',async()=>{await wsAction('memory_save',{id:m.id,text:input.value});await wsRefresh();}),wsButton('Supprimer',async()=>{await wsAction('memory_delete',{id:m.id});await wsRefresh();}));return row;}));}
$('ws-project-search').oninput=wsDrawProjects;$('ws-archived').onchange=wsDrawProjects;
$('ws-create-project').onsubmit=e=>{e.preventDefault();wsTry(async()=>{const r=await wsAction('project_create',{title:$('ws-project-name').value});$('ws-project-name').value='';await wsRefresh();await wsSelectProject(r.id);});};
for(const id of ['ws-project-title','ws-project-instructions'])$(id).oninput=()=>{ws.projectDirty=true;$('ws-project-status').textContent='Consignes à enregistrer';};
async function wsSaveProject(archived){const p=ws.data.projects.find(p=>p.id===ws.project);await wsAction('project_save',{id:p.id,title:$('ws-project-title').value,instructions:$('ws-project-instructions').value,archived:archived??!!p.archived,revision:ws.projectRevision});ws.projectDirty=false;await wsRefresh();$('ws-project-status').textContent='Projet enregistré';}
$('ws-project-form').onsubmit=e=>{e.preventDefault();wsTry(()=>wsSaveProject());};$('ws-project-archive').onclick=()=>wsTry(async()=>{await wsFlush();const p=ws.data.projects.find(p=>p.id===ws.project);await wsSaveProject(!p.archived);});
$('ws-project-chat').onclick=()=>wsTry(async()=>{if(busy)throw new Error('Attendez la fin de la réponse.');$('new').click();const c=wsCurrent();c.project_id=ws.project;save();wsChatSelections();showView('chat');});
async function wsLoadConversation(id){return wsConversationAction(async()=>{
  const remote=await wsAction('conversation_get',{id});if(!validMessages(remote.messages))throw new Error('Discussion serveur invalide.');
  let c=library.find(c=>c.id.replaceAll('-','')===id);
  if(c&&JSON.stringify(c.messages)!==JSON.stringify(remote.messages)&&!confirm('Votre copie locale est différente. La remplacer par la version du serveur ? Exportez-la d’abord si nécessaire.'))return;
  if(!c){if(library.length>=200)throw new Error('Limite de 200 discussions locales.');c={id:remote.id,title:remote.title,messages:remote.messages};library.unshift(c);}
  Object.assign(c,{title:remote.title,messages:remote.messages,project_id:remote.project,server_revision:remote.revision,archived:Boolean(remote.archived)});
  currentId=c.id;messages=c.messages;$('conversation-filter').value=c.archived?'archived':'active';showView('chat');
});}

async function wsOpenDocument(id){await wsFlush();const d=await wsAction('document_get',{id});ws.document=d;ws.dirty=false;ws.conflict=false;$('ws-document-title').value=d.title;$('ws-document-text').value=d.text;$('ws-document-editor').hidden=false;$('ws-proposal').hidden=true;$('ws-document-original').hidden=d.kind==='note';$('ws-document-status').textContent='Enregistré sur le serveur · '+(d.index_state==='empty'?'aucun passage indexable':(d.chunk_count??'')+' passage(s) indexé(s)')+(d.page_count?' · '+d.page_count+' page(s)':'');}
function wsDraft(){if(!ws.document)return null;return {id:ws.document.id,project:ws.document.project,title:$('ws-document-title').value,text:$('ws-document-text').value,revision:ws.document.revision};}
function wsKeepDraft(){const draft=wsDraft();ws.draftWrites=ws.draftWrites.catch(()=>{}).then(()=>api('/client/draft',{draft}));return ws.draftWrites;}
async function wsFlush(){clearTimeout(ws.timer);await ws.draftWrites;await ws.writes;if(!ws.dirty||!ws.document)return;if(ws.conflict)throw new Error('Brouillon conservé : comparez avec la version serveur avant d’enregistrer.');const draft=wsDraft(),active=ws.document;ws.writes=wsAction('document_save',{id:draft.id,project:draft.project,title:draft.title,text:draft.text,revision:draft.revision}).then(async r=>{active.revision=r.revision;if(ws.document!==active)return;const unchanged=$('ws-document-title').value===draft.title&&$('ws-document-text').value===draft.text;ws.dirty=!unchanged;$('ws-document-status').textContent=unchanged?'Enregistré sur le serveur':'Modifications à enregistrer';if(unchanged)await api('/client/draft',{draft:null});else await wsKeepDraft();}).catch(e=>{if(e.status===409)ws.conflict=true;$('ws-document-status').textContent='Brouillon conservé : '+e.message;throw e;});try{await ws.writes;}finally{ws.writes=Promise.resolve();}}
for(const id of ['ws-document-title','ws-document-text'])$(id).oninput=()=>{ws.dirty=true;$('ws-document-status').textContent='Enregistrement…';wsKeepDraft().catch(e=>error(e));clearTimeout(ws.timer);if(!ws.conflict)ws.timer=setTimeout(()=>wsFlush().catch(e=>error(e)),1200);};
const originalFlushHistory=flushHistory;flushHistory=async function(){await wsFlush();if(ws.projectDirty)await wsSaveProject();return originalFlushHistory();};
$('ws-document-save').onclick=()=>wsTry(()=>wsFlush());
$('ws-document-reload').onclick=()=>wsTry(async()=>{if(!ws.document)return;const server=await wsAction('document_get',{id:ws.document.id});$('ws-side-title').textContent='Version serveur · '+server.title;$('ws-side-text').textContent=server.text;$('ws-side').hidden=false;if(confirm('La version serveur s’affiche à droite. Conserver votre texte actuel comme brouillon basé sur cette révision ?')){ws.document.revision=server.revision;ws.conflict=false;ws.dirty=true;await wsKeepDraft();$('ws-document-status').textContent='Brouillon conservé. Enregistrez pour remplacer cette version serveur.';}});
function wsDownload(title,data,type='text/markdown;charset=utf-8'){const url=URL.createObjectURL(new Blob([data],{type})),a=wsElement('a');a.href=url;a.download=title;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('ws-document-export').onclick=()=>wsDownload(($('ws-document-title').value||'document')+'.md',$('ws-document-text').value);
$('ws-document-original').onclick=()=>wsTry(async()=>{const r=await wsAction('document_download',{id:ws.document.id});wsDownload(r.title,Uint8Array.from(atob(r.data),c=>c.charCodeAt(0)),'application/octet-stream');});

$('ws-upload').onchange=()=>wsTry(async()=>{try{const file=$('ws-upload').files[0];if(!file)return;if(file.size>2*1024*1024)throw new Error('Maximum 2 Mo par fichier.');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=()=>reject(new Error('Lecture du fichier impossible.'));reader.readAsDataURL(file);});$('ws-project-status').textContent='Import et extraction du fichier…';const r=await wsAction('document_upload',{project:ws.project,title:file.name,data});await wsRefresh();await wsOpenDocument(r.id);}finally{$('ws-upload').value='';}});

function wsConversationRecord(id){
  const canonical=id.replaceAll('-',''),local=library.find(c=>c.id.replaceAll('-','')===canonical);
  let published=null;
  for(const p of ws.data?.projects||[]){const row=p.conversations.find(c=>c.id===canonical);if(row){published={...row,project:p.id};break;}}
  if(!local&&!published)throw new Error('Conversation introuvable. Actualisez les projets.');
  return {id:canonical,local,published,revision:local?.server_revision||published?.revision||0};
}
async function wsConversationAction(run){
  if(conversationLocked())throw new Error('Attendez la fin de l’action en cours.');
  conversationActionPending=true;wsCloseConversationMenu();buttons();drawLibrary();
  try{save();await flushHistory();await run();save();await flushHistory();if(ws.data&&connected)await wsRefresh();}
  finally{conversationActionPending=false;render();drawLibrary();wsDrawProjectConversations();buttons();}
}
async function wsMoveConversation(id,project){
  return wsConversationAction(async()=>{
    const row=wsConversationRecord(id),previous=row.local?.project_id||row.published?.project||null;
    if(previous===project)return;
    const target=ws.data?.projects.find(p=>p.id===project);
    if(project&&(!target||target.archived))throw new Error('Choisissez un projet actif.');
    let revision=row.revision;
    if(revision){
      if(!project){
        if(!row.local)throw new Error('Ouvrez cette discussion avant de la retirer du projet.');
        // Removing the publication leaves the complete personal history intact.
        await wsAction('conversation_delete',{id:row.id,revision});revision=0;
      }else revision=(await wsAction('conversation_move',{id:row.id,project,revision})).revision;
    }
    if(row.local){row.local.project_id=project;row.local.document_id=null;row.local.server_revision=revision;}
  });
}
async function wsArchiveConversation(id){
  return wsConversationAction(async()=>{
    const row=wsConversationRecord(id),archived=!Boolean(row.local?.archived??row.published?.archived);
    const result=row.revision?await wsAction('conversation_archive',{id:row.id,revision:row.revision,archived}):null;
    if(row.local){row.local.archived=archived;if(result)row.local.server_revision=result.revision;}
  });
}
async function wsDeleteConversation(id){

    const row=wsConversationRecord(id),local=row.local?JSON.parse(JSON.stringify(row.local)):null;
    let remote=null;

    const index=local?library.indexOf(row.local):-1;

    deletedConversation={local,remote,index,placeholder};$('undo-delete').hidden=false;
  });
}
async function wsUndoConversationDelete(){

    const deleted=deletedConversation,candidate=library.filter(c=>c.id!==deleted.placeholder||c.messages.length||c.project_id||c.title!=='Nouvelle conversation');

fredInboxPane.innerHTML='<h2>Notifications</h2><p>Vos résultats et alertes sont conservés sur le serveur. Ils sont retrouvés à la reconnexion.</p><div class="ws-toolbar"><button type="button" class="secondary" id="fred-inbox-refresh">Actualiser</button><button type="button" class="secondary" id="fred-inbox-read-all">Tout marquer lu</button></div><p id="fred-inbox-status" role="status"></p><div id="fred-inbox-list"></div><details class="revision-details"><summary>Préférences de notification</summary><form id="fred-inbox-preferences" class="ws-card"><div id="fred-inbox-types"></div><label><input type="checkbox" id="fred-inbox-discreet" checked> Alertes discrètes</label><small class="muted">Le contenu privé des documents et conversations est masqué dans les alertes.</small><button class="secondary" type="submit">Enregistrer les préférences</button><p>Les alertes Android nécessitent votre autorisation. Une application complètement arrêtée récupère les événements à sa prochaine ouverture.</p></form></details>';
document.querySelector('.workspace').append(fredInboxPane);
const fredInboxNav=wsElement('button','Notifications','nav-button');fredInboxNav.dataset.viewButton='notifications';fredInboxNav.onclick=()=>showView('notifications');const fredInboxAnchor=document.querySelector('[data-view-button="access"]');$('client-navigation').insertBefore(fredInboxNav,fredInboxAnchor?.parentNode===$('client-navigation')?fredInboxAnchor:null);
for(const [key,label] of Object.entries(fredNotificationTypes)){const line=wsElement('label');const box=wsElement('input');box.type='checkbox';box.dataset.notificationType=key;box.checked=true;line.append(box,document.createTextNode(' '+label));$('fred-inbox-types').append(line);}
function fredAndroidInbox(payload){if(typeof window.androidInboxChanged==='function')window.androidInboxChanged(payload);}
function fredInboxDraw(){const rows=[...fredInbox.items.values()].sort((a,b)=>b.sequence-a.sequence);$('fred-inbox-list').replaceChildren();for(const item of rows){const card=wsElement('article',undefined,'ws-card fred-notification'+(item.read_at?'':' unread'));card.dataset.notificationId=item.id;card.append(wsElement('h3',item.title||'Notification'),wsElement('p',item.body||''),wsElement('small',new Date(item.created*1000).toLocaleString()+(item.read_at?' · Lu':' · Non lu'),'muted'));card.append(wsButton('Ouvrir',()=>window.fredOpenNotificationById(item.id)));if(!item.read_at)card.append(wsButton('Marquer lu',()=>fredInboxRead([item.id])));$('fred-inbox-list').append(card);}if(!rows.length)$('fred-inbox-list').append(wsElement('p','Aucune notification pour le moment.'));const unread=rows.filter(x=>!x.read_at).length;fredInboxNav.dataset.unreadCount=String(unread);fredInboxNav.textContent='Notifications'+(unread?' · '+unread:'');if(typeof uiDecorateNavigation==='function')uiDecorateNavigation();if(fredInbox.preferences&&!fredInbox.dirty){for(const box of $('fred-inbox-types').querySelectorAll('input'))box.checked=fredInbox.preferences.types[box.dataset.notificationType]!==false;$('fred-inbox-discreet').checked=fredInbox.preferences.discreet!==false;}}
async function fredInboxRead(ids){for(let i=0;i<ids.length;i+=100)await api('/v1/notifications/action',{action:'read',ids:ids.slice(i,i+100)});await fredInboxLoad();}
async function fredInboxLoad(){if(fredInbox.busy)return;fredInbox.busy=true;try{let payload=await api('/v1/notifications/action',{action:'list',after:fredInbox.cursor,limit:100});if(fredInbox.generation&&fredInbox.generation!==payload.generation){fredInbox.items.clear();fredInbox.cursor=0;fredInbox.loaded=false;fredAndroidInbox({reset:true,generation:payload.generation,items:[]});payload=await api('/v1/notifications/action',{action:'list',after:0,limit:100});}const newlyDelivered=[];for(let page=0;page<11;page++){if(fredInbox.generation&&fredInbox.generation!==payload.generation){fredInbox.items.clear();fredInbox.cursor=0;fredInbox.loaded=false;newlyDelivered.length=0;fredAndroidInbox({reset:true,generation:payload.generation,items:[]});payload=await api('/v1/notifications/action',{action:'list',after:0,limit:100});}fredInbox.generation=payload.generation;fredInbox.preferences=payload.preferences;for(const item of payload.items||[]){if(!fredInbox.items.has(item.id))newlyDelivered.push(item.id);fredInbox.items.set(item.id,item);}if(Array.isArray(payload.retained_ids)){const retained=new Set(payload.retained_ids);for(const id of fredInbox.items.keys())if(!retained.has(id))fredInbox.items.delete(id);}const read=new Set(payload.read_ids||[]);for(const item of fredInbox.items.values()){if(read.has(item.id))item.read_at=item.read_at||Date.now()/1000;item.enabled=payload.preferences.types[item.type]!==false&&payload.subscription.enabled!==false;}fredInbox.cursor=payload.cursor;fredAndroidInbox({...payload,items:[...fredInbox.items.values()]});if(!payload.has_more)break;payload=await api('/v1/notifications/action',{action:'list',after:fredInbox.cursor,limit:100});}if(fredInbox.items.size>1000){const oldest=[...fredInbox.items.values()].sort((a,b)=>a.sequence-b.sequence);for(const item of oldest.slice(0,oldest.length-1000))fredInbox.items.delete(item.id);}fredInboxDraw();fredInbox.loaded=true;$('fred-inbox-status').textContent='Notifications synchronisées avec le serveur.';const retainedDelivered=newlyDelivered.filter(id=>fredInbox.items.has(id));for(let i=0;i<retainedDelivered.length;i+=100){try{await api('/v1/notifications/action',{action:'delivered',ids:retainedDelivered.slice(i,i+100)});}catch(e){if(e.status===401)throw e;/* A receipt may expire between list and acknowledgement. The authenticated inbox stays usable. */}}}catch(e){if(e.status===401||e.status===403){fredInbox.items.clear();fredInbox.cursor=0;fredInbox.loaded=false;fredInboxDraw();fredAndroidInbox({access_revoked:true,items:[]});}$('fred-inbox-status').textContent=e.status===404?'Le serveur ne propose pas encore les notifications.':('Actualisation indisponible : '+e.message);}finally{fredInbox.busy=false;}}
window.fredOpenNotification=async target=>{if(target?.kind==='job'){await wsRefresh();showView('tasks');await wsOpenJob(target.id);}else if(target?.kind==='document'){await wsFlush();await wsSelectProject(target.project);await wsOpenDocument(target.id);showView('projects');}else{showView('notifications');await fredInboxLoad();}};
window.fredOpenNotificationById=async id=>{try{const value=await api('/v1/notifications/action',{action:'get',id});await api('/v1/notifications/action',{action:'read',ids:[id]});const cached=fredInbox.items.get(id);if(cached)cached.read_at=Date.now()/1000;await window.fredOpenNotification(value.notification.target);await fredInboxLoad();}catch(e){showView('notifications');error(e);return false;}};
const fredShowView=showView;showView=function(name){fredShowView(name);if(name==='notifications'){$('workspace-heading').textContent='Notifications';fredInboxLoad();}};
$('fred-inbox-refresh').onclick=()=>fredInboxLoad();$('fred-inbox-read-all').onclick=()=>wsTry(()=>fredInboxRead([...fredInbox.items.values()].filter(x=>!x.read_at).map(x=>x.id)));
$('fred-inbox-preferences').oninput=()=>fredInbox.dirty=true;
$('fred-inbox-preferences').onsubmit=e=>{e.preventDefault();wsTry(async()=>{if(!fredInbox.preferences)throw new Error('Reconnectez-vous pour enregistrer vos préférences.');const types={};for(const box of $('fred-inbox-types').querySelectorAll('input'))types[box.dataset.notificationType]=box.checked;try{await api('/v1/notifications/action',{action:'preferences',revision:fredInbox.preferences.revision,types,discreet:$('fred-inbox-discreet').checked});fredInbox.dirty=false;await fredInboxLoad();}catch(e){if(e.status===409){await fredInboxLoad();throw new Error('Les préférences ont changé sur un autre client. Vos choix restent visibles ; cliquez de nouveau pour les enregistrer.');}throw e;}});};
clientReady.then(()=>fredInboxLoad());setInterval(()=>{if(!document.hidden)fredInboxLoad();},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)fredInboxLoad();});

</script>
