<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniPilot — pilotage local</title>
<style>
  body{font-family:Segoe UI,Arial,sans-serif;margin:0 auto;max-width:1000px;padding:16px;color:#1c1c1c}
  h1{font-size:22px;margin:0 0 4px} .sub{color:#666;margin-bottom:16px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid #ddd;padding:6px 8px;text-align:left}
  th{background:#f4f4f4} input,select,textarea{padding:6px;font-size:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  button{padding:7px 12px;cursor:pointer}
  .tabs{display:flex;gap:8px;margin:12px 0}
  .card{border:1px solid #ddd;padding:12px;margin:8px 0}
  code{background:#f4f4f4;padding:1px 4px}
</style>
</head>
<body>
<h1>MiniPilot</h1>
<div class="sub">Mini ERP local — projets, tâches, livrables, jalons, matrice CDC (fonctions / contraintes). Base : <code>127.0.0.1:8001</code></div>

<div class="card">
  <b>Créer un projet</b>
  <div class="row">
    <input id="p-code" placeholder="Code (ex: PRJ-001)" size="14">
    <input id="p-title" placeholder="Titre du projet" size="40">
    <button onclick="createProject()">Créer</button>
  </div>
</div>

<div class="card">
  <b>Projets</b>
  <div class="row"><button onclick="loadProjects()">↻ Recharger</button></div>
  <table><thead><tr><th>Code</th><th>Titre</th><th>Statut</th><th></th></tr></thead>
  <tbody id="projects"></tbody></table>
</div>

<div class="card" id="detail" style="display:none">
  <b id="d-title"></b>
  <div class="tabs">
    <button onclick="showTab('tasks')">Tâches</button>
    <button onclick="showTab('cdc')">Matrice CDC</button>
  </div>
  <div id="tab-tasks">
    <div class="row">
      <input id="t-title" placeholder="Nouvelle tâche" size="40">
      <input id="t-due" placeholder="Échéance (ex: 2026-10-01)" size="16">
      <button onclick="addTask()">+ Tâche</button>
    </div>
    <table><thead><tr><th>Tâche</th><th>Statut</th><th>Échéance</th></tr></thead><tbody id="tasks"></tbody></table>
  </div>
  <div id="tab-cdc" style="display:none">
    <div class="row">
      <select id="c-kind">
        <option value="function">function</option><option value="constraint">constraint</option>
        <option value="requirement">requirement</option><option value="data">data</option>
        <option value="interface">interface</option><option value="open_point">open_point</option>
      </select>
      <input id="c-title" placeholder="Titre" size="24">
      <input id="c-quote" placeholder="Citation exacte du CDC" size="30">
      <input id="c-page" type="number" min="1" value="1" style="width:64px">
      <button onclick="addItem()">+ Élément</button>
    </div>
    <table><thead><tr><th>Type</th><th>Titre</th><th>Citation</th><th>Page</th></tr></thead><tbody id="items"></tbody></table>
  </div>
</div>

<script>
const API = '/api/v1';
let current = null;
async function createProject(){
  const code = document.getElementById('p-code').value;
  const title = document.getElementById('p-title').value;
  if(!title) return alert('Titre requis');
  await fetch(API+'/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,title})});
  document.getElementById('p-title').value=''; loadProjects();
}
async function loadProjects(){
  const r = await fetch(API+'/projects'); const list = await r.json();
  document.getElementById('projects').innerHTML = list.map(p=>
    `<tr><td>${p.code||''}</td><td>${p.title}</td><td>${p.status}</td><td><button onclick="openProject('${p.id}','${p.title.replace(/'/g,"")}')">Ouvrir</button></td></tr>`).join('');
}
async function openProject(id,title){
  current = id; document.getElementById('detail').style.display='block';
  document.getElementById('d-title').textContent = title; refreshDetail();
}
async function refreshDetail(){
  const r = await fetch(API+'/projects/'+current); const d = await r.json();
  document.getElementById('tasks').innerHTML = (d.tasks||[]).map(t=>`<tr><td>${t.title}</td><td>${t.status}</td><td>${t.due_date||''}</td></tr>`).join('');
  const r2 = await fetch(API+'/projects/'+current+'/cdc/items'); const items = await r2.json();
  document.getElementById('items').innerHTML = items.map(i=>`<tr><td>${i.kind}</td><td>${i.title}</td><td>${i.source_quote}</td><td>${i.physical_page}</td></tr>`).join('');
}
async function addTask(){
  const title = document.getElementById('t-title').value; if(!title) return;
  const due_date = document.getElementById('t-due').value;
  await fetch(API+'/projects/'+current+'/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,due_date})});
  document.getElementById('t-title').value=''; refreshDetail();
}
async function addItem(){
  const kind = document.getElementById('c-kind').value;
  const title = document.getElementById('c-title').value;
  const source_quote = document.getElementById('c-quote').value;
  const physical_page = parseInt(document.getElementById('c-page').value||'1');
  if(!title||!source_quote) return alert('Titre + citation exacte requis (règle XPilot)');
  const r = await fetch(API+'/projects/'+current+'/cdc/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,title,source_quote,physical_page})});
  if(!r.ok){ alert(await r.text()); return; }
  document.getElementById('c-title').value=''; document.getElementById('c-quote').value=''; refreshDetail();
}
function showTab(n){
  document.getElementById('tab-tasks').style.display = n==='tasks'?'block':'none';
  document.getElementById('tab-cdc').style.display = n==='cdc'?'block':'none';
}
loadProjects();
</script>
</body>
</html>
