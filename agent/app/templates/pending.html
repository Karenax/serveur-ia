<!doctype html><html><head><meta charset="utf-8"><title>Résolution</title><script>
const nativeFetch = window.fetch.bind(window);
let agentSession;
window.fetch = async (url, init = {}) => {
  const method = (init.method || 'GET').toUpperCase();
  if (!['GET', 'HEAD'].includes(method)) {
    agentSession ||= nativeFetch('/api/v1/session').then(r => r.json());
    const {token} = await agentSession;
    init.headers = {...init.headers, 'X-Agent-Token': token};
  }
  const response = await nativeFetch(url, init);
  if (!response.ok) {
    if (response.status === 403) agentSession = undefined;
    const data = await response.clone().json().catch(() => ({}));
    const message = typeof data.detail === 'string' ? data.detail : data.detail?.message || 'Échec de la requête';
    alert(message);
    const error = new Error(message); error.detail = data.detail; throw error;
  }
  return response;
};
</script></head><body>
<nav><a href="/ui">Accueil</a><a href="/ui/pending">Résolution projet</a><a href="/ui/proposals">Validation</a><a href="/ui/settings">Paramètres</a></nav><h1>Sources en attente de projet</h1>
{% for s in rows %}<div style="border:1px solid #ccc;margin:1rem 0;padding:1rem">
<b>{{s.source_type}}</b> {{s.author}} — {{s.source_metadata.get('subject','')}}<br>
<small>{{s.id}}</small><br>
{% for p in projects %}<button onclick="fix('{{s.id}}','{{p.id}}')">{{p.code}}</button> {% endfor %}
</div>{% else %}<p>Aucune en attente.</p>{% endfor %}
<script>async function fix(sid,pid){await fetch(`/v1/resolution/${sid}/confirm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:pid})});location.reload()}</script>
</body></html>
